# =====================================================================
#  docker-compose - SGAN API
#  Portas e credenciais parametrizadas via .env (veja .env.example).
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: sgan-api:latest
    container_name: sgan_app
    restart: unless-stopped
    working_dir: /var/www
    # Sem bind-mount do código em produção: a imagem já contém app + vendor.
    # Apenas o storage é persistido em volume nomeado.
    volumes:
      - sgan_storage:/var/www/storage/app
    # IMPORTANTE: não usamos env_file aqui de propósito. Injetar o .env como
    # variáveis de ambiente do SO faz com que elas tenham precedência sobre
    # tudo (inclusive sobre phpunit.xml), o que já causou dois bugs: APP_KEY
    # vazia vencendo a chave do arquivo e a suíte de testes apagando o banco
    # real. O Laravel lê o próprio arquivo .env (bind-mount em dev / COPY em
    # prod). Só passamos o destino do banco, que depende da rede do compose.
    environment:
      DB_HOST: db
      DB_PORT: 5432
    networks:
      - sgan_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: sgan_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sgan_network
    depends_on:
      - app

  db:
    image: postgres:16.4-alpine
    container_name: sgan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sgan_db}
      POSTGRES_USER: ${DB_USERNAME:-sgan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    # Porta do banco NÃO publicada por padrão (só rede interna).
    # Para depurar localmente, defina DB_PUBLISH_PORT no .env.
    ports:
      - "${DB_PUBLISH_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sgan_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sgan_user} -d ${DB_DATABASE:-sgan_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  sgan_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  sgan_storage:
    driver: local
