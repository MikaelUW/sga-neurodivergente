# =====================================================================
#  Override de DESENVOLVIMENTO (carregado automaticamente pelo compose).
#  Monta o código para edição ao vivo, publica o banco e sobe o Adminer.
#  Em produção use:  docker compose -f docker-compose.yml up -d
# =====================================================================

services:
  app:
    build:
      target: runtime
    volumes:
      # Bind-mount do código para desenvolvimento (hot edit).
      - .:/var/www
      # Mantém o vendor da imagem (não deixa o bind-mount escondê-lo).
      - /var/www/vendor

  web:
    volumes:
      - .:/var/www

  db:
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"

  adminer:
    image: adminer:4.8.1
    container_name: sgan_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - sgan_network
    depends_on:
      - db
