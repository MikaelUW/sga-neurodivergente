# =====================================================================
#  Nginx — perfil de PRODUÇÃO (terminação TLS no próprio container).
#  Use com docker-compose.prod.yml. Requer certificados montados em
#  /etc/nginx/certs (fullchain.pem + privkey.pem).
#
#  Alternativa: se você terminar TLS num proxy/LB externo (Traefik,
#  Caddy, ALB), use o default.conf (porta 80) atrás dele e ative o
#  HSTS lá. Este arquivo cobre o caso "nginx termina o TLS".
# =====================================================================

# HTTP -> redireciona tudo para HTTPS (exceto o desafio ACME/well-known).
server {
    listen 80;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    client_max_body_size 20M;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Cabeçalhos de segurança ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS ativo (só faz sentido atrás de HTTPS, que é o caso aqui).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Bloqueia acesso a arquivos ocultos (ex.: .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
